name: Release Maubot Plugin

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Check out code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Determine next release version
      run: |
        VERSION=$(python3 scripts/release_version.py peek)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Check if release already exists
      run: |
        RELEASE_EXIST=$(gh release view $VERSION > /dev/null 2>&1 && echo "true" || echo "false")
        echo "RELEASE_EXIST=$RELEASE_EXIST" >> $GITHUB_ENV

    - name: Generate Changelog
      if: env.RELEASE_EXIST == 'false'
      run: |
        echo "Changelog:" > CHANGELOG.md
        git log $(git describe --tags --abbrev=0)..HEAD --pretty=format:"- %h: %s" -- base-config.yaml maubot.yaml requirements.txt scripts socialmediadownload.py >> CHANGELOG.md

    - name: Package Release
      if: env.RELEASE_EXIST == 'false'
      run: ./scripts/build-mbp.sh

    - name: Create and Upload GitHub Release
      if: env.RELEASE_EXIST == 'false'
      run: |
        gh release create ${{ env.VERSION }} "build/SocialMediaDown-v${{ env.VERSION }}.mbp" -t ${{ env.VERSION }} -F CHANGELOG.md
